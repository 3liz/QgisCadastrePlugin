variables:
  PRODUCT_NAME: cadastre

stages:
- lint
- test
- build
- deploy
- release


# ------------
# Lint
# ------------
lint:
  image: ${REGISTRY_URL}/factory-ci-runner:qgis-${QGIS_FLAVOR}
  tags:
    - factory-plain
  stage: lint
  script:
    - pip install --quiet -r requirements/lint.txt -r requirements/security.txt
    - make lint scan
  parallel:
    matrix:
      - QGIS_FLAVOR: [ "ltr", "release" ]

# ------------
# Tests
# ------------

.tests:
  image: ${REGISTRY_URL}/factory-ci-runner:factory-ci
  tags:
    - factory-dind
  stage: test
  script:
    - make docker-test QGIS_VERSION=$QGIS_FLAVOR

qgis-tests:
  extends: .tests
  parallel:
    matrix:
      - QGIS_FLAVOR: [
        "3.40",
        "3.44",
        "4.0",
        "4.2",
      ]


# NOTE: Following jobs are triggered only on RELEASE_BRANCH == "true"

# 
# Packages 
#


build:
  image: $REGISTRY_URI/factory-ci-runner:qgis-plugin-ci
  stage: build
  tags:
    - factory-plain
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(?:release-|v)?\d+\.\d+\.\d+(?:-.*)?$/'
      variables:
        PRERELEASE: ""
    - if: $RELEASE_BRANCH == "true"
      variables:
        PRERELEASE: "--pre"
  script:
      - echo "Building plugin ${PRODUCT_NAME}"
      - yapt-pkg package $PRERELEASE
      - echo "PACKAGE=`ls -1 *.zip`" > build.env
      - cat build.env
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - "*.zip"


deploy:
  image: $REGISTRY_URI/factory-ci-runner:fabric-ci
  stage: deploy 
  tags:
    - fabric
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(?:release-|v)?\d+\.\d+\.\d+(?:-.*)?$/'
    - if: $RELEASE_BRANCH == "true"
  dependencies:
    - build
  script:
    - upload_plugins ${PRODUCT_NAME} ${PACKAGE}
    - update-snap-qgis-plugins

#
# Release
#

# XXX Deprecate ci-tools and adapts scripts to qgis-plugin-ci runner

release:
  image:
    name: $REGISTRY_URI/infra/ci-tools:latest
  tags:
    - factory-plain
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(?:release-|v)?\d+\.\d+\.\d+(?:-.*)?$/'
  script:
    - create_ticket.py
    - gitlab_release
  variables:
    # Needed by create_ticket.py, like in the other QGIS plugins
    FACTORY_PRODUCT_NAME: cadastre
    FACTORY_PACKAGE_TYPE: plugin

