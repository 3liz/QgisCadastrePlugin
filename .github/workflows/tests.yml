name: Tests 🎳

on: [workflow_call]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: "pip"
          cache-dependency-path: |
            requirements/lint.txt
            requirements/security.txt

      - name: Install Python requirements
        run: pip install -r requirements/lint.txt -r requirements/security.txt

      - name: Run linter
        run: ruff check --output-format=concise cadastre

      - name: Run typechecker
        run: make typecheck

      - name: Run QGIS plugins security check
        run: bandit -r cadastre --severity-level all

  tests:
    needs: [linter]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis_version: [
          "3.40",
          "3.44",
          "4.0",
          "4.2",
        ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Running tests
        run: make docker-test QGIS_VERSION=${{ matrix.qgis_version }}
