name: 📖 Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'mkdocs.yml'
      # Structure of the database, documented by SchemaSpy
      - 'cadastre/scripts/**'
      - 'cadastre/cadastre_import.py'
      - '.docker/docker-compose.yml'
      - '.docker/schemaspy_import.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

    - name: Get source code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Set up NodeJS (for search index prebuilding)
      uses: actions/setup-node@v6
      with:
        node-version: '12'

    - name: Cache project dependencies (pip)
      uses: actions/cache@v5.0.5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements/doc.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r requirements/doc.txt

    # The database documentation is not versioned (docs/database is in .gitignore): it is generated by SchemaSpy
    # from the schema created by an import of the test data with the plugin
    - name: Generate the database documentation with SchemaSpy
      run: make schemaspy

    - name: Copy CHANGELOG.md and CONTRIBUTING.md
      run: |
        cp CHANGELOG.md docs/
        cp CONTRIBUTING.md docs/

    - name: Deploy to Github Pages
      run: |
        git config --global user.name "${{ secrets.BOT_NAME }}"
        git config --global user.email "${{ secrets.BOT_MAIL }}"
        mkdocs gh-deploy --clean --force --verbose
