name: lint

on:
  push:
    tags: 
      - '*'
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  linter:
    runs-on: ubuntu-latest
    name: "Lint"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: "pip"
          cache-dependency-path: "requirements/lint.txt"

      - name: Install Python requirements
        run: pip install -r requirements/lint.txt

      - name: Run linter
        run: |
          ruff check --preview --output-format=concise cadastre
